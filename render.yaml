services:
  - type: web
    name: taxi-backend-service
    env: docker
    dockerfilePath: ./Dockerfile.prod
    plan: free
    region: oregon
    envVars:
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: taxi-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: taxi-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: taxi-db
    plan: free
    databaseName: taxi_db
    user: taxi_user

# Note: Render doesn't support Redis in the free tier via Blueprint automatically sometimes,
# but this is the standard definition. You might need to create Redis manually or use an external provider.
